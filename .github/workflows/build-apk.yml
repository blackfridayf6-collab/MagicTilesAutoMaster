
      - name: Extract Android project
        run: |
          unzip -o MagicTilesAutoMaster-source.zip -d /tmp/source
          cp -R /tmp/source/MagicTilesAutoMaster/. .

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="accessibility_service_description">Permite ao Auto Master tocar nas faixas do jogo.</string>
          </resources>
          EOF

          sed -i 's|android:description="Permite ao Auto Master tocar nas faixas do jogo."|android:description="@string/accessibility_service_description"|' app/src/main/res/xml/accessibility_service_config.xml
          
